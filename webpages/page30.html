<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢谢</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            width: 1280px;
            min-height: 720px;
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f5f5f5;
            color: #1f2937;
            position: relative;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gradient-shape-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            opacity: 0.1;
            z-index: 1;
        }
        .gradient-shape-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            opacity: 0.1;
            z-index: 1;
        }
        .gradient-shape-3 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            opacity: 0.1;
            z-index: 1;
        }
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
        }
        .contact-section {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .contact-title {
            font-size: 24px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .contact-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .contact-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }
        .company-name {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .contact-details {
            font-size: 16px;
            color: #4a5568;
            line-height: 1.6;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .closing-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.6;
        }
        .decorative-icons {
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }
        .icon-1 {
            top: 15%;
            left: 15%;
            color: #667eea;
            animation-delay: 0s;
        }
        .icon-2 {
            top: 25%;
            right: 20%;
            color: #764ba2;
            animation-delay: 1s;
        }
        .icon-3 {
            bottom: 30%;
            left: 20%;
            color: #4facfe;
            animation-delay: 2s;
        }
        .icon-4 {
            bottom: 20%;
            right: 15%;
            color: #00f2fe;
            animation-delay: 1.5s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .page-footer {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 16px;
            color: #718096;
            font-weight: 500;
        }
        
        .contact-info p {
            margin: 8px 0;
            font-size: 1.1rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 1280px) {
            body {
                padding: 0 20px;
            }
            .content-area {
                padding: 40px 20px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0 10px;
            }
            .content-area {
                padding: 20px 10px;
            }
            .thank-you-title {
                font-size: 3rem;
            }
            .subtitle {
                font-size: 1.25rem;
            }
            .contact-info p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative Elements -->
    <div class="gradient-shape-1"></div>
    <div class="gradient-shape-2"></div>
    <div class="gradient-shape-3"></div>
    <div class="grid-lines"></div>
    
    <!-- Floating Icons -->
    <i class="fas fa-lightbulb decorative-icons icon-1"></i>
    <i class="fas fa-rocket decorative-icons icon-2"></i>
    <i class="fas fa-handshake decorative-icons icon-3"></i>
    <i class="fas fa-star decorative-icons icon-4"></i>
    
    <!-- Main Content -->
    <div class="relative z-10 text-center max-w-4xl p-16">
        <!-- Thank You Title -->
        <h1 class="text-7xl font-bold mb-8">
            <span class="bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">谢谢！</span>
        </h1>
        <div class="text-3xl text-gray-600 mb-10 font-medium">感谢您的聆听与关注</div>
        
        <div class="text-xl text-gray-700 leading-relaxed mb-12 max-w-2xl mx-auto">
            感谢您对四川能投智慧光电智慧产业生态合作方案的关注和支持。我们期待与您携手合作，共同开创智慧建筑产业的美好未来。
        </div>
            
        <!-- Contact Section -->
        <div class="bg-gray-50 p-10 rounded-2xl mb-8 shadow-sm">
            <div class="flex items-center justify-center mb-8">
                <i class="fas fa-address-book text-blue-600 text-2xl mr-3"></i>
                <h2 class="text-2xl font-semibold text-gray-800">联系我们</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-500">
                    <div class="flex items-center mb-4">
                        <i class="fas fa-building text-blue-600 text-xl mr-3"></i>
                        <h3 class="text-xl font-semibold text-gray-800">四川能投智慧光电有限公司</h3>
                    </div>
                    <div class="space-y-3 text-gray-600">
                        <div class="flex items-center">
                            <i class="fas fa-phone text-green-600 w-5 mr-3"></i>
                            <span>电话：028-8888-8888</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-envelope text-red-600 w-5 mr-3"></i>
                            <span>邮箱：cooperation@scnt-solar.com</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-map-marker-alt text-purple-600 w-5 mr-3"></i>
                            <span>地址：成都市高新区天府大道</span>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-purple-500">
                    <div class="flex items-center mb-4">
                        <i class="fas fa-university text-purple-600 text-xl mr-3"></i>
                        <h3 class="text-xl font-semibold text-gray-800">电子科技大学</h3>
                    </div>
                    <div class="space-y-3 text-gray-600">
                        <div class="flex items-center">
                            <i class="fas fa-phone text-green-600 w-5 mr-3"></i>
                            <span>电话：028-6666-6666</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-envelope text-red-600 w-5 mr-3"></i>
                            <span>邮箱：cooperation@uestc.edu.cn</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-map-marker-alt text-purple-600 w-5 mr-3"></i>
                            <span>地址：成都市成华区建设北路</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            
        <!-- Closing Message -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-8 rounded-2xl text-center">
            <i class="fas fa-heart text-red-300 text-2xl mb-4 block"></i>
            <p class="text-lg font-medium leading-relaxed">
                让我们携手共进，以创新驱动发展，以合作创造价值，共同构建智慧产业生态新格局！
            </p>
        </div>
    </div>
    
    <!-- Page Footer -->
    <div class="absolute bottom-6 right-8 text-gray-500 font-medium">30 / 30</div>
</body>
</html>
