<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社会效益与产业带动</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            width: 1280px;
            min-height: 720px;
            clip-path: inset(0 0 0 0);
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f5f5f5;
            color: #1f2937;
        }
        
        .gradient-shape-1 {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(59, 130, 246, 0.05) 100%);
        }
        
        .gradient-shape-2 {
            background: linear-gradient(225deg, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0.05) 100%);
        }
        
        .grid-lines {
            background-image: 
                linear-gradient(to right, rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .benefit-card {
            transition: all 0.3s ease;
        }
        
        .benefit-card:hover {
            transform: translateY(-5px);
        }
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 28px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .benefit-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .benefit-card:hover {
            transform: translateY(-5px);
        }
        .benefit-title {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .benefit-desc {
            font-size: 16px;
            color: #4a5568;
            line-height: 1.6;
        }
        .impact-metrics {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .metric-item {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .metric-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .page-footer {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 16px;
            color: #718096;
            font-weight: 500;
        }
        
        /* 响应式设计 */
        @media (max-width: 1280px) {
            body {
                padding: 0 20px;
            }
            .content-area {
                padding: 40px 20px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0 10px;
            }
            .content-area {
                padding: 20px 10px;
            }
            .grid-cols-12 {
                grid-template-columns: 1fr;
            }
            .col-span-6 {
                grid-column: span 1;
            }
            .page-title {
                font-size: 2rem;
            }
            .benefit-card {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
<div class="relative w-[1280px] h-[720px] bg-[#f5f5f5] grid-lines">
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 w-[500px] min-h-[500px] gradient-shape-1 rounded-bl-[300px] -z-0"></div>
<div class="absolute bottom-0 left-0 w-[400px] min-h-[400px] gradient-shape-2 rounded-tr-[250px] -z-0"></div>
<!-- Content Container -->
<div class="absolute inset-0 flex flex-col px-24 py-16 z-10">
<!-- Header -->
<div class="mb-8">
<h1 class="text-4xl font-bold mb-2">社会效益与产业带动</h1>
<div class="min-h-[3px] w-[80px] bg-gradient-to-r from-[#3b82f6] to-[#10b981]"></div>
</div>
            
<!-- Main Content -->
<div class="grid grid-cols-12 gap-6">
<!-- Left Column - Talent Development -->
<div class="col-span-6">
<div class="bg-white bg-opacity-80 p-6 rounded-lg shadow-sm border border-gray-100 h-full">
<div class="flex items-center mb-4">
<div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mr-4">
<i class="fas fa-users text-blue-500 text-xl"></i>
</div>
<h2 class="text-2xl font-semibold">人才培养与就业创造</h2>
</div>
<div class="space-y-4 mt-6">
<div class="benefit-card flex">
<div class="mr-3 text-green-500">
<i class="fas fa-graduation-cap"></i>
</div>
<div>
<h3 class="font-medium">高端人才培养</h3>
<p class="text-gray-600">通过产学研合作，培养智慧建筑、新能源、人工智能等领域的高端技术人才，提升区域人才竞争力</p>
</div>
</div>
<div class="benefit-card flex">
<div class="mr-3 text-blue-500">
<i class="fas fa-briefcase"></i>
</div>
<div>
<h3 class="font-medium">就业岗位创造</h3>
<p class="text-gray-600">项目建设和运营将创造大量就业机会，包括技术研发、项目管理、运营维护等多个层次的岗位</p>
</div>
</div>
</div>
</div>
</div>
            
<!-- Right Column - Industry Innovation -->
<div class="col-span-6">
<div class="bg-white bg-opacity-80 p-6 rounded-lg shadow-sm border border-gray-100 h-full">
<div class="flex items-center mb-4">
<div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mr-4">
<i class="fas fa-industry text-purple-500 text-xl"></i>
</div>
<h2 class="text-2xl font-semibold">产业升级与技术创新</h2>
</div>
<div class="space-y-4 mt-6">
<div class="benefit-card flex">
<div class="mr-3 text-red-500">
<i class="fas fa-rocket"></i>
</div>
<div>
<h3 class="font-medium">产业链升级</h3>
<p class="text-gray-600">推动传统建筑业向智慧建筑转型，带动上下游产业链协同发展，提升整体产业竞争力</p>
</div>
</div>
<div class="benefit-card flex">
<div class="mr-3 text-yellow-500">
<i class="fas fa-lightbulb"></i>
</div>
<div>
<h3 class="font-medium">技术创新推动</h3>
<p class="text-gray-600">促进新技术研发和应用，形成技术创新生态，推动相关产业技术进步和产品升级</p>
</div>
</div>
</div>
</div>
</div>
</div>
            
            <div class="impact-metrics">
                <h3 style="font-size: 24px; font-weight: 600; margin-bottom: 10px; text-align: center;">
                    <i class="fas fa-chart-line"></i> 预期社会影响指标
                </h3>
                <div class="metrics-grid">
                    <div class="metric-item">
                        <div class="metric-number">500+</div>
                        <div class="metric-label">直接就业岗位</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-number">2000+</div>
                        <div class="metric-label">间接就业岗位</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-number">50+</div>
                        <div class="metric-label">合作企业</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-number">100+</div>
                        <div class="metric-label">技术专利</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="page-footer">26 / 30</div>
    </div>
</body>
</html>
